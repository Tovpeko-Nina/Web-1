<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Food Construct - Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0;
            margin: 0;
        }
        
        #auth-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?ixlib=rb-4.0.3');
            background-size: cover;
            background-position: center;
            opacity: 0.7;
            z-index: -1;
        }
        
        #auth-form-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px gray;
        }
        
        .auth-form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
        }
        
        .remember-me input {
            margin-right: 10px;
        }
        
        button {
            background-color: orange;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        
        button:hover {
            background-color: #FF8243;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: orange;
            text-decoration: none;
            text-align: center;
            width: 100%;
        }
        
    </style>
</head>
<body>
    <header>
        <h1> Food Construct </h1>
        <nav>
            <a href="index.html" class="link-light-bg">Главная</a>
            <a href="index.html#about" class="link-light-bg">О нас</a>
            <a href="pack_lunch.html" class="link-light-bg">Собрать ланч</a>
            <a href="index.html#contacts" class="link-light-bg">Контакты</a>
            <a href="feedback.html" class="link-light-bg">Обратная связь</a>
            <a href="auth.html" class="link-light-bg active">Войти</a>
        </nav>
    </header>

    <main>
        <div id="auth-background"></div>
        <div id="auth-form-container">
            <h2>Форма аутентификации</h2>
            <form action="https://httpbin.org/post" method="post">
                <div class="auth-form-group">
                    <label for="login">Логин:</label>
                    <input type="text" id="login" name="login" required>
                </div>
                
                <div class="auth-form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="auth-form-group remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Запомнить меня</label>
                </div>
                
                <button type="submit">Войти</button>
            </form>
            
            <a href="index.html" class="back-link">Вернуться на главную</a>
        </div>
    </main>

    <footer id="contacts">
        <p class="white-color-for-text">Позвонить нам: <a href="tel:+70000000000" class="link-dark-bg">+7-000-000-00-00</a></p>
    </footer>
</body>
</html>
